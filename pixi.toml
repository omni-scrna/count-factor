[workspace]
authors = ["Samuel Gunz <samuel.gunz@uzh.ch>"]
channels = ["conda-forge", "bioconda"]
name = "count-factor"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
bioconductor-newwave = ">=1.20.0,<2"
bioconductor-rhdf5 = "*"
bioconductor-hdf5array = "*"
bioconductor-rhdf5lib = ">=1.32.0,<2"
bioconductor-delayedarray = ">=0.36.0,<0.37"
r-base = ">=4.5.3,<4.6"
bioconductor-anndatar = ">=1.0.2,<2"
bioconductor-singlecellexperiment = "*"
r-argparser = "*"
r-stringr = "*"
r-yaml = "*"
"r-data.table" = "*"
r-scgbm = "*"
r-glmpca = "*"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }
